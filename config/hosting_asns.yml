# コメント投稿を拒否するクラウド・ホスティング事業者（VPN・プロキシの出口として使われる）
# CommentIpRestriction が GeoLite2-ASN の判定結果と照合する

# ASN（自律システム番号）
asns:
  - 16509   # Amazon (AWS)
  - 14618   # Amazon (AWS)
  - 15169   # Google
  - 396982  # Google Cloud
  - 8075    # Microsoft (Azure)
  - 31898   # Oracle Cloud
  - 45102   # Alibaba Cloud
  - 132203  # Tencent Cloud
  - 136907  # Huawei Cloud
  - 14061   # DigitalOcean
  - 63949   # Akamai (Linode)
  - 20473   # Vultr (Choopa)
  - 16276   # OVH
  - 24940   # Hetzner
  - 51167   # Contabo
  - 12876   # Scaleway
  - 60781   # Leaseweb
  - 28753   # Leaseweb
  - 9009    # M247（商用VPNの出口として多用される）
  - 60068   # Datacamp / CDN77（商用VPNの出口として多用される）
  - 212238  # Datacamp（商用VPNの出口として多用される）
  - 13335   # Cloudflare（WARP など）
  - 9370    # さくらインターネット
  - 7684    # さくらインターネット

# ASN の組織名にこれらの語を含む場合もホスティング事業者とみなす（大文字小文字は区別しない）
organization_keywords:
  - vpn
  - hosting
  - datacenter
  - data center
  - vps
