# コメントで投稿を拒否する NG ワード（CommentModeration が使用）
#
# 照合前にコメント・NG ワードの両方を正規化する:
#   全角/半角の統一（NFKC）、英字の小文字化、カタカナ→ひらがな、空白・記号の除去
# そのため「キモい」「きもい」「ｷﾓｲ」「死 ね」「死.ね」などは1つの書き方を登録すれば足りる
#
# 部分一致で判定するため、普通の文章にも現れる語（「カス」→「カスタム」、「ゴミ」→「ゴミ箱」、
# 「馬鹿」→「馬鹿にならない」など）は登録しないこと
